# Builds every core artifact and, for a v* tag, publishes them as a GitHub
# release. Manual runs build the artifacts without releasing.
name: core-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  TAGS: with_gvisor,with_quic,with_utls,with_clash_api

defaults:
  run:
    shell: bash
    working-directory: core

jobs:
  sidecar:
    name: sidecar (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="$(git describe --tags --always --dirty)"
          go build -trimpath -tags "$TAGS" -ldflags "-s -w -X main.version=${version}" \
            -o "../dist/core-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/core
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  darwin-universal:
    name: sidecar (darwin/universal)
    needs: sidecar
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: core-darwin-*
          path: dist
          merge-multiple: true
      - name: lipo
        working-directory: dist
        run: |
          lipo -create core-darwin-amd64 core-darwin-arm64 -output core-darwin-universal
          lipo -info core-darwin-universal
      - uses: actions/upload-artifact@v4
        with:
          name: core-darwin-universal
          path: dist/core-darwin-universal

  android-aar:
    name: gomobile bind (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build gomobile and gobind at the versions pinned in go.mod
        run: |
          mkdir -p "$RUNNER_TEMP/gomobile"
          go build -o "$RUNNER_TEMP/gomobile/" golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "$RUNNER_TEMP/gomobile" >> "$GITHUB_PATH"
      - name: gomobile bind
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p ../dist # gomobile does not create the output's parent directory
          gomobile bind -target=android -androidapi 21 -javapkg app.geotunnel -tags "$TAGS" \
            -trimpath -ldflags "-s -w" -o ../dist/core.aar ./mobile
      - uses: actions/upload-artifact@v4
        with:
          name: core-android
          path: dist/*

  ios-xcframework:
    name: gomobile bind (ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Build gomobile and gobind at the versions pinned in go.mod
        run: |
          mkdir -p "$RUNNER_TEMP/gomobile"
          go build -o "$RUNNER_TEMP/gomobile/" golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "$RUNNER_TEMP/gomobile" >> "$GITHUB_PATH"
      - name: gomobile bind
        run: |
          mkdir -p ../dist
          gomobile bind -target=ios,iossimulator -prefix GT -tags "$TAGS" \
            -trimpath -ldflags "-s -w" -o ../dist/Core.xcframework ./mobile
          cd ../dist && ditto -c -k --keepParent Core.xcframework Core.xcframework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: core-ios
          path: dist/Core.xcframework.zip

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sidecar, darwin-universal, android-aar, ios-xcframework]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
